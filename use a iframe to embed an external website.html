<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embedded Website Example</title>
</head>
<body>
  <h1>Embedded Website Example</h1>

  <!-- Iframe embedding Wikipedia -->
  <iframe 
    src="https://www.wikipedia.org" 
    width="80%" 
    height="500" 
    title="Wikipedia Website" 
    style="border:1px solid #000;">
  </iframe>

  <!-- Warning paragraph -->
  <p>Some websites may not allow embedding for security reasons.</p>
</body>
</html>
