<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iframes Example</title>
</head>
<body>
  <h1>About Me and My Hobby</h1>

  <!-- First iframe: Introduction page -->
  <iframe 
    src="introduction.html" 
    width="80%" 
    height="300" 
    title="My Introduction"
    style="border:2px solid #555; display:block; margin:20px auto;">
  </iframe>

  <!-- Second iframe: Hobby page -->
  <iframe 
    src="hobby.html" 
    width="80%" 
    height="300" 
    title="My Favorite Hobby"
    style="border:2px solid #555; display:block; margin:20px auto;">
  </iframe>
</body>
</html>
