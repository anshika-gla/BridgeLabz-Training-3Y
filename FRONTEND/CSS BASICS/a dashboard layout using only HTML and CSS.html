<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Layout</title>
  <style>
    /* Reset and global styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #1e3d59;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 2rem;
      font-size: 1.5rem;
      z-index: 1000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    /* Container for sidebar and main content */
    .dashboard {
      display: flex;
      margin-top: 60px; /* offset for fixed header */
      min-height: calc(100vh - 60px);
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background-color: #00796b;
      color: #fff;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      min-height: 100vh; /* full screen height */
      position: sticky;
      top: 60px; /* stick below header */
    }

    .sidebar a {
      color: #fff;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    .sidebar a:hover {
      background-color: #004d40;
    }

    /* Main content */
    .main-content {
      flex: 1;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .content-box {
      background-color: #fff;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      flex: 1;
    }

    /* Responsive layout */
    @media screen and (max-width: 768px) {
      .dashboard {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        position: relative;
        top: 0;
        min-height: auto;
      }

      .main-content {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>

  <header>
    My Dashboard
  </header>

  <div class="dashboard">
    <!-- Sidebar -->
    <nav class="sidebar">
      <a href="#">Home</a>
      <a href="#">Profile</a>
      <a href="#">Messages</a>
      <a href="#">Settings</a>
      <a href="#">Logout</a>
    </nav>

    <!-- Main content -->
    <div class="main-content">
      <div class="content-box">
        <h2>Analytics Overview</h2>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Quisque in arcu a nunc imperdiet fermentum.</p>
      </div>
      <div class="content-box">
        <h2>Recent Activities</h2>
        <p>Curabitur sit amet leo vitae neque bibendum laoreet. Duis non turpis sit amet elit tincidunt tincidunt.</p>
      </div>
    </div>
  </div>

</body>
</html>
