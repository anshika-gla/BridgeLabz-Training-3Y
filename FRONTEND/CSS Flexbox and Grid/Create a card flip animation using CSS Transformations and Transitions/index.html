<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Flip Animation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card-container">
    <div class="card">
      <!-- Front Side -->
      <div class="card-face card-front">
        <img src="https://picsum.photos/300/200" alt="Card Image">
        <h2>Beautiful View</h2>
      </div>

      <!-- Back Side -->
      <div class="card-face card-back">
        <h2>About This Place</h2>
        <p>This location offers stunning views and peaceful surroundings — perfect for relaxation and photography lovers.</p>
      </div>
    </div>
  </div>

</body>
</html>
