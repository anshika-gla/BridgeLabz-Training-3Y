<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Flexbox + Grid Layout</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">MyBrand</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- MAIN SECTION -->
  <main>
    <article>
      <h1 class="animated-title">Welcome to My Portfolio</h1>
      <div class="box-container">
        <div class="box">Design</div>
        <div class="box">Development</div>
        <div class="box">Marketing</div>
      </div>
    </article>

    <aside>
      <h2>Sidebar</h2>
      <p>This is the sidebar section with useful links or info.</p>
    </aside>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>© 2025 MyBrand. All rights reserved.</p>
  </footer>

</body>
</html>
