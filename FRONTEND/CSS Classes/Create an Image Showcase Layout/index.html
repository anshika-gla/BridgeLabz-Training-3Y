<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Image Showcase Gallery</h1>

  <section class="gallery">
    <figure class="gallery-item">
      <img src="https://picsum.photos/400/250?random=1" alt="Nature 1">
      <figcaption>Beautiful Mountain View</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/400/250?random=2" alt="Nature 2">
      <figcaption>Calm Lake at Sunset</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/400/250?random=3" alt="Nature 3">
      <figcaption>Path Through the Forest</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/400/250?random=4" alt="Nature 4">
      <figcaption>Snowy Mountain Peak</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/400/250?random=5" alt="Nature 5">
      <figcaption>Golden Beach Morning</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/400/250?random=6" alt="Nature 6">
      <figcaption>Green Valley Landscape</figcaption>
    </figure>
  </section>

</body>
</html>
