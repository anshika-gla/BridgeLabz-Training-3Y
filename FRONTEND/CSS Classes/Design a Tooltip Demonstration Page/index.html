<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Demonstration Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>CSS Tooltip Demonstration</h1>

  <div class="tooltip-container">
    
    <!-- Tooltip 1 -->
    <div class="tooltip">
      💡
      <span class="tooltip-text">This is a light bulb idea!</span>
    </div>

    <!-- Tooltip 2 -->
    <div class="tooltip">
      ❤️
      <span class="tooltip-text">Spread love everywhere you go!</span>
    </div>

    <!-- Tooltip 3 -->
    <div class="tooltip">
      📘
      <span class="tooltip-text">Read more to learn more!</span>
    </div>

    <!-- Tooltip 4 -->
    <div class="tooltip">
      🌍
      <span class="tooltip-text">The Earth is our home.</span>
    </div>

  </div>

</body>
</html>
