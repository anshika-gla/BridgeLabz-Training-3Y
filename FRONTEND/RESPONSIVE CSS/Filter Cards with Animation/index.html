<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Cards with Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="title">Team Profiles</h1>

  <div class="card-container">
    <div class="card">
      <img src="https://picsum.photos/id/1005/300/200" alt="Profile 1">
      <h2>Alex Johnson</h2>
      <p>Frontend Developer passionate about clean design and UX.</p>
    </div>

    <div class="card">
      <img src="https://picsum.photos/id/1011/300/200" alt="Profile 2">
      <h2>Maria Lee</h2>
      <p>UI/UX Designer creating seamless and intuitive experiences.</p>
    </div>

    <div class="card">
      <img src="https://picsum.photos/id/1027/300/200" alt="Profile 3">
      <h2>James Smith</h2>
      <p>Backend Engineer focused on scalable and efficient solutions.</p>
    </div>
  </div>

</body>
</html>
