<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="title">Responsive Image Filter Gallery</h1>

  <div class="gallery">
    <figure class="img-card">
      <img src="https://picsum.photos/id/1015/400/300" alt="Blur Effect">
      <figcaption>Blur Filter</figcaption>
    </figure>

    <figure class="img-card">
      <img src="https://picsum.photos/id/1025/400/300" alt="Grayscale Effect">
      <figcaption>Grayscale Filter</figcaption>
    </figure>

    <figure class="img-card">
      <img src="https://picsum.photos/id/1041/400/300" alt="Sepia Effect">
      <figcaption>Sepia Filter</figcaption>
    </figure>

    <figure class="img-card">
      <img src="https://picsum.photos/id/1062/400/300" alt="Brightness Effect">
      <figcaption>Brightness Filter</figcaption>
    </figure>

    <figure class="img-card">
      <img src="https://picsum.photos/id/1074/400/300" alt="Contrast Effect">
      <figcaption>Contrast Filter</figcaption>
    </figure>

    <figure class="img-card">
      <img src="https://picsum.photos/id/1084/400/300" alt="Hue Rotate Effect">
      <figcaption>Hue-Rotate Filter</figcaption>
    </figure>
  </div>

</body>
</html>
