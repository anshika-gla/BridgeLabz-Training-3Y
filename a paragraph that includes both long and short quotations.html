<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotations Example</title>
</head>
<body>
  <h1>Using Quotations in HTML</h1>

  <!-- Long quote using blockquote -->
  <blockquote>
    "Success is not final, failure is not fatal: It is the courage to continue that counts. 
    Always remember that challenges are a part of life & they teach valuable lessons."
  </blockquote>

  <!-- Short quote inside a paragraph using q -->
  <p>
    Many people say <q>Practice makes perfect & patience is key</q> when learning a new skill.
  </p>
</body>
</html>
