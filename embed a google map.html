<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Map Embed</title>
</head>
<body>
  <h1>My School Location</h1>

  <!-- Embedded Google Map of a city (you can replace the URL with your own school or area) -->
  <iframe 
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3650.032989769916!2d90.41411811498196!3d23.81033278456113!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3755c70a7aa8b6c1%3A0xeecf993c72f6a03c!2sDhaka%2C%20Bangladesh!5e0!3m2!1sen!2sin!4v1676543200000!5m2!1sen!2sin"
    width="80%" 
    height="400" 
    title="Map showing my school location"
    style="border:0;" 
    allowfullscreen 
    loading="lazy">
  </iframe>

  <!-- The 'loading="lazy"' attribute delays loading of the map until the user scrolls near it,
       improving page speed and performance. -->
</body>
</html>
