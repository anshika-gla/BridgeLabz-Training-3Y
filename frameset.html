<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frameset Example</title>
</head>

<!-- Using frameset instead of body -->
<frameset rows="25%,75%">
  <!-- Top frame for navigation -->
  <frame src="nav.html" name="topFrame" title="Navigation">

  <!-- Bottom frame for content -->
  <frame src="welcome.html" name="bottomFrame" title="Main Content">
</frameset>

<!-- The <body> tag is not used when using <frameset> -->
</html>
