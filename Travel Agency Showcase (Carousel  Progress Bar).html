<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Agency Showcase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <div class="container py-5">
    <h2 class="text-center fw-bold mb-4">Explore the World</h2>

    <!-- Carousel -->
    <div id="travelCarousel" class="carousel slide mb-5" data-bs-ride="carousel">
      <div class="carousel-inner">

        <!-- Slide 1 -->
        <div class="carousel-item active" data-bs-interval="2000">
          <img src="https://via.placeholder.com/1200x500/0077b6/ffffff?text=Maldives" class="d-block w-100" alt="Maldives" />
          <div class="carousel-caption d-none d-md-block">
            <h3>Maldives</h3>
            <p>Experience paradise like never before.</p>
          </div>
        </div>

        <!-- Slide 2 -->
        <div class="carousel-item" data-bs-interval="3000">
          <img src="https://via.placeholder.com/1200x500/ff8800/ffffff?text=Switzerland" class="d-block w-100" alt="Switzerland" />
          <div class="carousel-caption d-none d-md-block">
            <h3>Switzerland</h3>
            <p>Where nature meets perfection.</p>
          </div>
        </div>

        <!-- Slide 3 -->
        <div class="carousel-item" data-bs-interval="2500">
          <img src="https://via.placeholder.com/1200x500/6a4c93/ffffff?text=Japan" class="d-block w-100" alt="Japan" />
          <div class="carousel-caption d-none d-md-block">
            <h3>Japan</h3>
            <p>Tradition, culture, and modern beauty.</p>
          </div>
        </div>

      </div>

      <!-- Controls -->
      <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <!-- Progress Bar -->
    <h5 class="fw-bold mb-2">Booking Completion</h5>
    <div class="progress mb-5">
      <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 70%">70%</div>
    </div>

  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">Contact Us: travel@agency.com | +91 98765 43210</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
