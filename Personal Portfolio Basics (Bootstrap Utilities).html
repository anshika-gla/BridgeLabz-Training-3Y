<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Portfolio — Bootstrap</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">

  <!-- Header Section -->
  <header class="container text-center mt-5 mb-4">
    <h1 class="fw-bold">Your Name</h1>
    <p class="lead">Web Developer | Designer | Freelancer</p>
  </header>

  <!-- Profile Section -->
  <section class="container text-center p-5">
    <img src="https://via.placeholder.com/180" alt="Profile" class="img-fluid rounded-circle mb-3">

    <div class="mb-4">
      <button class="btn btn-primary me-2">Hire Me</button>
      <button class="btn btn-outline-dark">Download CV</button>
    </div>
  </section>

  <!-- Contact Form -->
  <section class="container p-5 bg-white rounded shadow-sm">
    <h2 class="text-center mb-4">Contact Me</h2>

    <form>
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Your Name">
      </div>

      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Your Email">
      </div>

      <div class="mb-3">
        <textarea class="form-control" rows="4" placeholder="Message"></textarea>
      </div>

      <div class="text-center">
        <button class="btn btn-success px-4">Send Message</button>
      </div>
    </form>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
