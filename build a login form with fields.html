<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
</head>
<body>
  <h1>Login</h1>

  <form action="#" method="post">
    <!-- Username field -->
    <label for="username">Username:</label><br>
    <input type="text" id="username" name="username" required><br><br>

    <!-- Password field -->
    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required><br><br>

    <!-- Hidden CSRF token -->
    <input type="hidden" name="csrf_token" value="dummy_csrf_token_12345">
    <!-- 
      The CSRF token is a unique value generated by the server to protect against 
      Cross-Site Request Forgery attacks. 
      It ensures that the form submission is coming from an authorized source and not 
      a malicious website.
    -->

    <input type="submit" value="Login">
  </form>
</body>
</html>
