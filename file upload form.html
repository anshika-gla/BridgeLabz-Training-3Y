<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Upload Form</title>
</head>
<body>
  <h1>Upload Your Image</h1>

  <form action="#" method="post" enctype="multipart/form-data">
    <!-- File input restricted to .jpg and .png -->
    <label for="image">Choose an image:</label><br>
    <input type="file" id="image" name="image" accept=".jpg, .jpeg, .png" required><br><br>

    <input type="submit" value="Upload">
  </form>

  <!-- Note about allowed file types -->
  <p>Note: Only image files in <strong>.jpg</strong> or <strong>.png</strong> format are allowed.</p>
</body>
</html>
