<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Page title displayed in browser tab -->
  <title>Complete Head Example</title>

  <!-- Character encoding for the page -->
  <meta charset="UTF-8">

  <!-- Page description for search engines -->
  <meta name="description" content="This page demonstrates all important head elements in HTML.">

  <!-- Author of the page -->
  <meta name="author" content="Anshika Tiwari">

  <!-- Base URL for all relative links on the page -->
  <base href="https://www.example.com/">

  <!-- Link to favicon or other external resources -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- Internal CSS style block (can be empty or contain styles) -->
  <style>
    /* Add your CSS styles here */
  </style>

  <!-- Internal JavaScript block (can be empty or contain scripts) -->
  <script>
    // Add your JavaScript code here
  </script>
</head>
<body>
  <h1>Head Elements Demonstration</h1>
  <p>This page includes <code>&lt;title&gt;</code>, <code>&lt;meta&gt;</code>, <code>&lt;base&gt;</code>, <code>&lt;link&gt;</code>, <code>&lt;style&gt;</code>, and <code>&lt;script&gt;</code> tags in the head section.</p>
</body>
</html>
