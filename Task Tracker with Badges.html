<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker with Badges</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light py-5">

  <div class="container">
    <div class="card p-4 shadow-sm">

      <!-- Header with Total Pending Tasks Badge -->
      <h3 class="fw-bold mb-4">
        Task Tracker
        <span class="badge bg-primary">5 Pending</span>
      </h3>

      <!-- Task List -->
      <ul class="list-group mb-4">
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Complete Project Report
          <span class="badge bg-danger">High</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Prepare Presentation Slides
          <span class="badge bg-warning text-dark">Medium</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Team Meeting at 4 PM
          <span class="badge bg-success">Low</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Fix UI Bugs
          <span class="badge bg-danger">High</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Update Documentation
          <span class="badge bg-warning text-dark">Medium</span>
        </li>
      </ul>

      <!-- Completed Button with Badge -->
      <button class="btn btn-success">
        Completed Tasks <span class="badge bg-light text-success">3</span>
      </button>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
