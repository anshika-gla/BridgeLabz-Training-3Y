<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    .price-card {
      transition: 0.3s ease;
      border-radius: 12px;
    }
    .price-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body class="bg-light py-5">

  <div class="container text-center">
    <h2 class="fw-bold mb-4">Choose Your Plan</h2>

    <div class="row g-4">

      <!-- Basic Plan -->
      <div class="col-md-4">
        <div class="card price-card p-3 shadow-sm">
          <h4 class="fw-bold">Basic</h4>
          <h2 class="text-primary fw-bold">$9<span class="fs-6">/mo</span></h2>
          <ul class="list-group list-group-flush text-start mt-3">
            <li class="list-group-item">✔ 5 Projects</li>
            <li class="list-group-item">✔ Email Support</li>
            <li class="list-group-item">✔ Basic Analytics</li>
          </ul>
          <button class="btn btn-outline-primary mt-3">Choose Plan</button>
        </div>
      </div>

      <!-- Pro Plan (Highlighted) -->
      <div class="col-md-4">
        <div class="card price-card p-3 bg-primary text-white shadow-sm">
          <h4 class="fw-bold">Pro</h4>
          <h2 class="fw-bold">$29<span class="fs-6">/mo</span></h2>
          <ul class="list-group list-group-flush text-start mt-3">
            <li class="list-group-item bg-primary text-white">✔ Unlimited Projects</li>
            <li class="list-group-item bg-primary text-white">✔ Priority Support</li>
            <li class="list-group-item bg-primary text-white">✔ Advanced Analytics</li>
          </ul>
          <button class="btn btn-light mt-3 fw-bold">Choose Plan</button>
        </div>
      </div>

      <!-- Enterprise Plan -->
      <div class="col-md-4">
        <div class="card price-card p-3 shadow-sm">
          <h4 class="fw-bold">Enterprise</h4>
          <h2 class="text-primary fw-bold">$49<span class="fs-6">/mo</span></h2>
          <ul class="list-group list-group-flush text-start mt-3">
            <li class="list-group-item">✔ Unlimited Projects</li>
            <li class="list-group-item">✔ Dedicated Manager</li>
            <li class="list-group-item">✔ Full Analytics Suite</li>
          </ul>
          <button class="btn btn-outline-primary mt-3">Choose Plan</button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
